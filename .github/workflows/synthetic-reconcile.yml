# Reconciliation sweep — reaps leaked release-monitor synthetic identities.
#
# The release monitor mints a real Clerk user + org per wired run and deletes
# both from a `finally`. Three paths defeat that and leak an identity whose ids
# no longer exist in any process, so nothing can clean it up by id: a SIGKILL
# (no grace for the handler), the gap before a created id is reported to
# `onResourceCreated`, and a transient Clerk DELETE failure. This job is the
# backstop `docs/deployment/release-monitoring.md` has called required since
# the monitor shipped, and which did not exist until now.
#
# Safety — this DELETES USERS FROM PRODUCTION CLERK. The invariants live in
# apps/web/lib/release-monitor/reconcileSynthetics.ts and are unit-tested in
# release-monitor-reconcile.test.ts. In short: a user is deleted only when
# `public_metadata.synthetic === true` AND `public_metadata.purpose ===
# 'release-monitor'` AND every address on the account matches
# `svc-monitor+…@vitalcv.com` AND it is older than the age grace. Conjunction,
# never disjunction; unknown age never authorises a delete; a per-run cap
# bounds the blast radius; and each candidate is re-validated immediately
# before its DELETE.
#
# Cadence: hourly at :23. The age grace (2 h) is what makes this safe to run
# often — a verification in flight can never be reaped, because release-verify's
# entire job budget is 15 minutes. Off-peak minute for the same reason the
# monitors use one: :00/:15/:30/:45 are the congested schedule slots.
#
# Not wired (CLERK_SECRET_KEY not visible) is a RED failure, not a no-op. It
# was a green no-op for exactly one day, on the reasoning that an unwired
# monitor mints nothing so nothing can leak — which held right up until the
# monitor was wired, at which point the same branch turned a misconfiguration
# into a clean bill of health (run 31233274419: Reconcile skipped, job success,
# Clerk never contacted). A sweep that cannot see the key is indistinguishable
# from a sweep that found nothing to reap, so it must not be green. Set
# MONITORS_UNWIRED_OK=true (a repository VARIABLE) to deliberately run unwired.
#
# THE KEY WAS ON THE DEPENDABOT SECRETS TAB, NOT THE ACTIONS ONE — which is why
# this sweep never ran. `Settings → Secrets and variables` keeps separate
# Actions, Dependabot and Codespaces stores. They look identical in the UI, and
# a Dependabot secret is INVISIBLE to `secrets.<name>` in an Actions job: it
# resolves to the empty string with no error, exactly like a name that was never
# configured at all.
#
# Measured 2026-08-08 by run 31258941186. A throwaway `ZZ_TEST` created moments
# earlier also read 0 — which killed every remaining naming theory, since a
# brand-new secret with a clean name cannot have a typo. In the same job
# CRON_SECRET read 64, PROBE_URL 19 and CLERK_FAPI_URL 25. Two of those three
# were absent from the secrets list the owner was reading, so Actions could see
# secrets the operator could not and vice versa: two different stores, not one
# store disagreeing with itself.

name: Synthetic Reconcile

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be deleted, delete nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Two concurrent sweeps would race on the same candidates; the loser would
  # log 404s that the code already treats as already-gone, but there is no
  # reason to create that noise. Never cancel one mid-flight.
  group: synthetic-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reap leaked synthetic identities
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No `environment:` — CLERK_SECRET_KEY_PROD is a REPOSITORY secret, and
    # repository secrets are visible to every job without one. The environment
    # declarations added in #1138/#1140 chased a shadowing theory that
    # measurement disproved; they are removed rather than left as clutter,
    # because an environment records a deployment on every run (fictional, for
    # an hourly sweep) and would silently BLOCK these runs the day a protection
    # rule lands on that environment.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No `pnpm install`: the runner imports only local .ts + Node built-ins,
      # matching release-verify.yml.

      - name: Preflight — is the monitor wired?
        id: preflight
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PROD }}
          # Escape hatch. Unset/anything-but-"true" means "this monitor is
          # expected to be wired" — see the fail-closed note below.
          UNWIRED_OK: ${{ vars.MONITORS_UNWIRED_OK }}
        run: |
          # FAIL-CLOSED. "Not wired" used to be a green no-op, on the reasoning
          # that an unwired monitor mints nothing so nothing can leak. That was
          # true right up until the monitor WAS wired — at which point the same
          # branch turned a misconfiguration into a clean bill of health.
          #
          # It happened six times and cost the whole point of the job: runs
          # 31233274419 / 31235056713 / 31237430191 / 31237517106 / 31253928362
          # skipped Reconcile having never contacted Clerk. The reason was not
          # exotic — the key was stored on the DEPENDABOT secrets tab, which an
          # Actions job cannot read. A sweep that cannot see the key is
          # indistinguishable, from the outside, from a sweep that found nothing
          # to reap, which is why the first three of those reported SUCCESS.
          #
          # So the default is now RED. To deliberately run unwired, set the
          # repository VARIABLE MONITORS_UNWIRED_OK=true — a visible, auditable
          # statement of intent, rather than silence meaning consent.
          if [ -n "${CLERK_SECRET_KEY}" ]; then
            echo "wired=true" >> "$GITHUB_OUTPUT"
          elif [ "${UNWIRED_OK}" = "true" ]; then
            echo "wired=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLERK_SECRET_KEY unset and MONITORS_UNWIRED_OK=true — deliberate no-op."
            {
              echo "## Synthetic reconciliation: skipped (deliberate)"
              echo ""
              echo "- Not wired, and \`MONITORS_UNWIRED_OK=true\` says that is intended."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "wired=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLERK_SECRET_KEY_PROD is not visible to this job — the sweep did NOT run. READ docs/deployment/clerk-rotation-2026-08.md BEFORE MOVING ANYTHING: as of 2026-08-08 a GitHub-side propagation fault means secrets in this repo may not reach Actions REGARDLESS of placement, and a support ticket is open. Confirm that is fixed before assuming misplacement. Otherwise: check which tab — Settings → Secrets and variables has separate Actions, Dependabot and Codespaces stores, they look identical, and a Dependabot secret reads as the empty string here with no error. It must be an ACTIONS repository secret named exactly CLERK_SECRET_KEY_PROD. If unwired is intended, set the repository variable MONITORS_UNWIRED_OK=true."
            {
              echo "## Synthetic reconciliation: MISCONFIGURED"
              echo ""
              echo "- \`CLERK_SECRET_KEY\` is not visible to this job, so **nothing was reconciled**."
              echo ""
              echo "### ⚠ Known GitHub-side fault, open since 2026-08-08"
              echo ""
              echo "**Do not start moving the secret around.** Secrets in this repository may not reach Actions **regardless of where they are placed**. A control secret created under *Repository secrets* on the **Actions** tab, with a known five-character value, read length 0 (job \`93113536112\`) and remained listed after a hard reload — so the write persists server-side but does not reach the Actions runtime. A GitHub support ticket is open."
              echo ""
              echo "Read [\`docs/deployment/clerk-rotation-2026-08.md\`](https://github.com/equals9/vitalcv-monorepo/blob/main/docs/deployment/clerk-rotation-2026-08.md) first. To check whether it is fixed, dispatch the secret visibility probe and see whether \`PROBE_CANARY\` reads **5**. If it still reads 0, nothing below will help and this red is expected."
              echo ""
              echo "### If that fault is resolved and this is still red"
              echo ""
              echo "- **Check the tab before anything else.** \`Settings → Secrets and variables\` keeps separate **Actions**, **Dependabot** and **Codespaces** stores. They look identical in the UI, and a Dependabot secret resolves to the empty string in an Actions job with no error — indistinguishable from a name that was never configured. That was the original cause on 2026-08-08, after four wrong theories about naming and scope."
              echo "- It must be an **Actions** repository secret named exactly \`CLERK_SECRET_KEY_PROD\`: <https://github.com/equals9/vitalcv-monorepo/settings/secrets/actions>"
              echo ""
              echo "This is deliberately RED. It is **not** evidence that there was nothing to reap."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Reconcile
        if: steps.preflight.outputs.wired == 'true'
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PROD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm reconcile:synthetics --dry-run --out reconcile.json
          else
            pnpm reconcile:synthetics --out reconcile.json
          fi
