name: Deploy Review Environment

# The pre-merge visual review surface (docs/deployment/review-environment.md).
#
# WHY THIS EXISTS. The founder visual gate (docs/ops/FOUNDER_VISUAL_GATE.md)
# requires rendered evidence before a visual PR may merge, but until now the
# only place to *interact* with a change was a reviewer's own laptop. The UX-V1
# cutover shipped on screenshots plus a localhost server for exactly that
# reason. This workflow gives a branch a real URL a human can click.
#
# WHAT IT IS NOT. It is not a second production. It has no database, so write
# paths degrade rather than touching real records; it reads through to the
# production API for public lookups only; it refuses indexing at three layers
# (robots.txt, X-Robots-Tag, empty sitemap — see
# lib/deployment/canonicalProduction.ts).
#
# SAFETY. The production environment ID is pinned and explicitly REFUSED as a
# target, and the resolved review domain is asserted not to be vitalcv.com. A
# workflow that can deploy anywhere is one typo away from being a production
# deploy, and this one is invoked by hand with an arbitrary ref.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to publish to the review environment'
        required: true
        default: 'main'
      pr:
        description: 'PR number to comment the review URL on (optional)'
        required: false

concurrency:
  group: deploy-review
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  RAILWAY_PROJECT_ID: 706ceff8-23ac-404c-a45b-449de5920848
  RAILWAY_WEB_SERVICE_ID: f31e461b-d617-4e7e-8a40-796a640ffc0b
  # Pinned so it can be REFUSED, never selected.
  RAILWAY_PRODUCTION_ENVIRONMENT_ID: cd700720-5c9d-472b-bf68-4b3cc65191cd
  RAILWAY_PRODUCTION_DOMAIN: vitalcv.com
  REVIEW_ENVIRONMENT_NAME: review
  # The container port. Must be ONE value used in two places — the PORT variable
  # the app listens on, and the service domain's targetPort Railway routes to.
  # Matches `EXPOSE 3000` and `next start -p ${PORT:-3000}` in apps/web.
  REVIEW_TARGET_PORT: '3000'

jobs:
  deploy-review:
    name: Publish ref to the review environment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the requested ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve the exact SHA
        id: resolve
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ inputs.ref }} → ${SHA}"

      # ── Preflight ─────────────────────────────────────────────────────────
      # Every read-only check, up front, collecting ALL failures before exiting.
      #
      # Why this exists: the mutating steps below each exit on their first
      # error, so a misconfiguration costs one run per problem to discover. The
      # first four real runs of this workflow found four separate issues, one at
      # a time, and each round-trip needed a human. This step answers "what is
      # wrong" in a single run.
      #
      # It mutates nothing, so it is always safe to read its output and stop.
      - name: Preflight — check everything that can be checked without mutating
        env:
          RAILWAY_REVIEW_TOKEN: ${{ secrets.RAILWAY_REVIEW_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -uo pipefail   # NOT -e: collect every failure, do not stop at one
          PROBLEMS=0
          fail() { echo "  ✗ $1"; PROBLEMS=$((PROBLEMS+1)); }
          ok()   { echo "  ✓ $1"; }

          echo "Credential"
          if [ -n "${RAILWAY_REVIEW_TOKEN:-}" ]; then
            AUTH="Project-Access-Token: ${RAILWAY_REVIEW_TOKEN}"; ok "RAILWAY_REVIEW_TOKEN present (review-scoped project token)"
          elif [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            AUTH="Authorization: Bearer ${RAILWAY_API_TOKEN}"; ok "RAILWAY_API_TOKEN present (account token)"
          else
            fail "no usable credential — set RAILWAY_REVIEW_TOKEN (preferred) or RAILWAY_API_TOKEN"
            [ -n "${RAILWAY_TOKEN:-}" ] && echo "    (RAILWAY_TOKEN is set but is production-scoped and cannot see this environment)"
            echo ""
            echo "    BEFORE SETTING IT AGAIN: this repository has an open GitHub"
            echo "    secret-propagation fault (first recorded 2026-08-08, support ticket"
            echo "    open). Secrets created since then do not reach Actions REGARDLESS of"
            echo "    which tab or scope they are placed on — RAILWAY_API_TOKEN was already"
            echo "    set once and read as the empty string here."
            echo ""
            echo "    Check whether it is still open before repeating yourself:"
            echo "      gh workflow run secret-visibility-probe.yml"
            echo "    If PROBE_CANARY reads 0, the fault is open and setting this secret"
            echo "    again will not help. If it reads 5, propagation works and this really"
            echo "    is a missing or misplaced secret."
            echo "    See docs/deployment/clerk-rotation-2026-08.md."
            echo ""
            echo "PREFLIGHT: ${PROBLEMS} problem(s). Nothing was changed."
            exit 1
          fi

          gql() {
            jq -n --arg query "$1" --argjson variables "$2" '{query:$query,variables:$variables}' > pf.json
            curl --silent --show-error https://backboard.railway.com/graphql/v2 \
              -H "${AUTH}" -H 'Content-Type: application/json' --data-binary @pf.json
          }

          echo "Project ${RAILWAY_PROJECT_ID}"
          gql 'query P($projectId: String!) {
            project(id: $projectId) {
              id name
              environments { edges { node { id name } } }
              services { edges { node { id name } } }
            }
          }' "$(jq -n --arg projectId "$RAILWAY_PROJECT_ID" '{projectId:$projectId}')" > pf-project.json

          if jq -e '.errors and (.errors|length>0)' pf-project.json >/dev/null 2>&1; then
            fail "project query returned errors: $(jq -c '[.errors[].message]' pf-project.json)"
          elif jq -e '.data.project == null' pf-project.json >/dev/null 2>&1; then
            fail "project is not readable with this credential"
          else
            ok "project readable: $(jq -r '.data.project.name' pf-project.json)"

            echo "Environments visible"
            jq -r '.data.project.environments.edges[]?.node | "    - \(.name) (\(.id))"' pf-project.json
            ENV_ID=$(jq -r --arg n "$REVIEW_ENVIRONMENT_NAME" '
              .data.project.environments.edges[]?.node
              | select((.name|ascii_downcase|gsub("^\\s+|\\s+$";"")) == ($n|ascii_downcase)) | .id' pf-project.json | head -1)
            if [ -n "$ENV_ID" ]; then
              ok "'${REVIEW_ENVIRONMENT_NAME}' resolves to ${ENV_ID}"
              if [ "$ENV_ID" = "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" ]; then
                fail "REFUSING: '${REVIEW_ENVIRONMENT_NAME}' resolved to the PRODUCTION environment id"
              fi
            else
              fail "'${REVIEW_ENVIRONMENT_NAME}' not visible (create it in Railway, or the token cannot see it)"
            fi

            echo "Service ${RAILWAY_WEB_SERVICE_ID}"
            if jq -e --arg id "$RAILWAY_WEB_SERVICE_ID" \
                 '[.data.project.services.edges[]?.node.id] | index($id) != null' pf-project.json >/dev/null 2>&1; then
              ok "web service present in this project"
            else
              fail "web service ${RAILWAY_WEB_SERVICE_ID} not visible in this project"
            fi

            if [ -n "$ENV_ID" ]; then
              echo "Domain"
              gql 'query D($projectId: String!, $environmentId: String!, $serviceId: String!) {
                domains(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) {
                  serviceDomains { domain targetPort }
                }
              }' "$(jq -n --arg projectId "$RAILWAY_PROJECT_ID" --arg environmentId "$ENV_ID" \
                     --arg serviceId "$RAILWAY_WEB_SERVICE_ID" \
                     '{projectId:$projectId,environmentId:$environmentId,serviceId:$serviceId}')" > pf-domains.json
              if jq -e '.errors and (.errors|length>0)' pf-domains.json >/dev/null 2>&1; then
                fail "domain query errored: $(jq -c '[.errors[].message]' pf-domains.json)"
              else
                D=$(jq -r '.data.domains.serviceDomains[0].domain // empty' pf-domains.json)
                P=$(jq -r '.data.domains.serviceDomains[0].targetPort // empty' pf-domains.json)
                if [ -z "$D" ]; then
                  ok "no domain yet — one will be created on port ${REVIEW_TARGET_PORT}"
                else
                  ok "existing domain ${D} (targetPort ${P:-unset})"
                  [ "$D" = "$RAILWAY_PRODUCTION_DOMAIN" ] && fail "REFUSING: review domain IS the production domain"
                  if [ -n "$P" ] && [ "$P" != "$REVIEW_TARGET_PORT" ]; then
                    fail "domain targetPort ${P} != app PORT ${REVIEW_TARGET_PORT} — the URL would 404 on a healthy container"
                  fi
                fi
              fi
            fi

            # Project membership is NOT enough. A Railway environment created as
            # "Empty Environment" has NO service instances, and every mutation
            # below addresses a (serviceId, environmentId) PAIR — so variables,
            # domain and deploy would all fail against an environment the
            # service does not live in. Found exactly this on 2026-08-09: the
            # `review` environment existed and was completely empty, which no
            # amount of credential would have fixed.
            if [ -n "$ENV_ID" ]; then
              echo "Service instance in ${REVIEW_ENVIRONMENT_NAME}"
              gql 'query SI($serviceId: String!, $environmentId: String!) {
                serviceInstance(serviceId: $serviceId, environmentId: $environmentId) { id serviceName }
              }' "$(jq -n --arg serviceId "$RAILWAY_WEB_SERVICE_ID" --arg environmentId "$ENV_ID" \
                     '{serviceId:$serviceId,environmentId:$environmentId}')" > pf-instance.json
              if jq -e '.data.serviceInstance.id' pf-instance.json >/dev/null 2>&1; then
                ok "service instance exists"
              else
                fail "the web service has NO instance in '${REVIEW_ENVIRONMENT_NAME}' — the environment is empty"
                echo "    Railway's New Environment dialog offers 'Duplicate Environment'"
                echo "    (copies services, variables and config) or 'Empty Environment'."
                echo "    An empty one cannot be deployed to. Recreate it by DUPLICATING"
                echo "    production, then remove what a visual review does not need."
                echo "    WARNING: duplicating also copies production VARIABLES, including"
                echo "    DATABASE_URL — the next check refuses that."
              fi
            fi

            # The review environment must not carry production's secrets. A
            # REFUSAL, not a cleanup: the workflow upserts a few variables
            # without `replace`, so anything inherited from a duplicated
            # production environment survives untouched.
            #
            # `unrendered: true` is load-bearing. Duplicating production copies
            # DATABASE_URL and CLERK_SECRET_KEY as REFERENCES
            # (`${{Postgres.DATABASE_URL}}`), and a reference to a service that
            # does not exist in this environment renders as the empty string —
            # so the rendered read called them "absent" and passed, while the
            # keys sat there waiting to resolve the moment anyone added a
            # Postgres to review. Read the raw value: a reference is a finding.
            #
            # The list is not just the database and Clerk. Duplication also
            # copies LITERAL secrets, and RECEIPT_PRIVATE_KEY_JWK is the issuer
            # signing key — a review deployment holding it could mint receipts
            # that verify as genuine under did:web:vitalcv.com. Found on
            # 2026-08-17, when the environment was first provisioned for real.
            if [ -n "$ENV_ID" ]; then
              echo "Inherited secrets"
              gql 'query V($projectId: String!, $environmentId: String!, $serviceId: String!) {
                variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId, unrendered: true)
              }' "$(jq -n --arg projectId "$RAILWAY_PROJECT_ID" --arg environmentId "$ENV_ID" \
                     --arg serviceId "$RAILWAY_WEB_SERVICE_ID" \
                     '{projectId:$projectId,environmentId:$environmentId,serviceId:$serviceId}')" > pf-vars.json
              if jq -e '.errors and (.errors|length>0)' pf-vars.json >/dev/null 2>&1; then
                echo "    (variables unreadable — skipping)"
              else
                for forbidden in DATABASE_URL CLERK_SECRET_KEY RECEIPT_PRIVATE_KEY_JWK CRON_SECRET; do
                  val=$(jq -r --arg k "$forbidden" '.data.variables[$k] // ""' pf-vars.json)
                  if [ -n "$val" ]; then
                    fail "${forbidden} is SET in '${REVIEW_ENVIRONMENT_NAME}' — clear it before deploying"
                  else
                    ok "${forbidden} absent"
                  fi
                done
              fi
            fi
          fi

          echo ""
          if [ "$PROBLEMS" -gt 0 ]; then
            echo "PREFLIGHT FAILED: ${PROBLEMS} problem(s) above. Nothing was changed."
            exit 1
          fi
          echo "PREFLIGHT PASSED — proceeding to mutate."

      - name: Resolve or create the review environment
        id: environment
        env:
          RAILWAY_REVIEW_TOKEN: ${{ secrets.RAILWAY_REVIEW_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          # Credential preference, most-specific first.
          #
          # RAILWAY_REVIEW_TOKEN is a Railway PROJECT token scoped to the review
          # environment — the least-privilege option, and the recommended one:
          # it can do everything this workflow needs and literally cannot reach
          # production, which matters for a workflow that takes an arbitrary ref
          # by hand. RAILWAY_TOKEN (scoped to production) is deliberately NOT a
          # fallback for review work: it cannot see this environment, and
          # letting it through only produces a confusing failure three steps
          # later.
          if [ -n "${RAILWAY_REVIEW_TOKEN:-}" ]; then
            AUTH="Project-Access-Token: ${RAILWAY_REVIEW_TOKEN}"
            echo "Using RAILWAY_REVIEW_TOKEN (project token scoped to review)."
          elif [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            AUTH="Authorization: Bearer ${RAILWAY_API_TOKEN}"
            echo "Using RAILWAY_API_TOKEN (account/workspace token)."
          else
            echo "::error::No usable Railway credential for the review environment."
            echo "::notice::Set ONE of these repository secrets (Settings → Secrets and"
            echo "::notice::variables → Actions):"
            echo "::notice::  RAILWAY_REVIEW_TOKEN — RECOMMENDED. In Railway, open the"
            echo "::notice::    'review' environment → Settings → Tokens → create a project"
            echo "::notice::    token FOR THAT ENVIRONMENT. Least privilege: it cannot touch"
            echo "::notice::    production. Same kind of credential as the existing"
            echo "::notice::    RAILWAY_TOKEN, which is scoped to production."
            echo "::notice::  RAILWAY_API_TOKEN — Railway → Account Settings → Tokens."
            echo "::notice::    Broader: it can reach every environment."
            if [ -n "${RAILWAY_TOKEN:-}" ]; then
              echo "::notice::RAILWAY_TOKEN is set but is scoped to PRODUCTION and cannot see"
              echo "::notice::the review environment, so it is not used here."
            fi
            echo "::notice::See docs/deployment/review-environment.md."
            exit 1
          fi
          echo "AUTH_HEADER=${AUTH}" >> "$GITHUB_ENV"

          api() {
            jq -n --arg query "$1" --argjson variables "$2" \
              '{query: $query, variables: $variables}' > req.json
            curl --fail-with-body --silent --show-error \
              https://backboard.railway.com/graphql/v2 \
              -H "${AUTH}" -H 'Content-Type: application/json' \
              --data-binary @req.json
          }

          LIST='query Envs($projectId: String!) {
            project(id: $projectId) {
              environments { edges { node { id name } } }
            }
          }'

          # Resolve the environment by name, case- and whitespace-insensitively.
          # Railway's own UI title-cases some input, and "Review" vs "review" is
          # not a difference worth failing a deploy over.
          resolve_env_id() {
            api "$LIST" "$(jq -n --arg projectId "$RAILWAY_PROJECT_ID" '{projectId: $projectId}')" > envs.json
            if jq -e '.errors and (.errors|length > 0)' envs.json >/dev/null; then
              jq '.errors' envs.json >&2
              return 1
            fi
            jq -r --arg name "$REVIEW_ENVIRONMENT_NAME" '
              .data.project.environments.edges[]?.node
              | select((.name | ascii_downcase | gsub("^\\s+|\\s+$"; ""))
                       == ($name | ascii_downcase))
              | .id' envs.json | head -1
          }

          ENV_ID=$(resolve_env_id || true)

          # A project token that cannot read the project returns a null node
          # rather than an error, which is indistinguishable from "no such
          # environment" unless the difference is named.
          if jq -e '.data.project == null' envs.json >/dev/null 2>&1; then
            echo "::error::The Railway token could not read project ${RAILWAY_PROJECT_ID}."
            echo "::notice::The environment list came back empty because the PROJECT is not"
            echo "::notice::readable with this credential — not because the environment is"
            echo "::notice::missing. Add a RAILWAY_API_TOKEN repository secret (Railway →"
            echo "::notice::Account Settings → Tokens); the workflow prefers it when present."
            exit 1
          fi

          echo "Environments visible to this token:"
          jq -r '.data.project.environments.edges[]?.node | "  - \(.name) (\(.id))"' envs.json

          if [ -z "$ENV_ID" ]; then
            echo "Review environment absent — creating it."
            CREATE='mutation CreateEnv($input: EnvironmentCreateInput!) {
              environmentCreate(input: $input) { id name }
            }'
            api "$CREATE" "$(jq -n \
              --arg projectId "$RAILWAY_PROJECT_ID" \
              --arg name "$REVIEW_ENVIRONMENT_NAME" \
              '{input: {projectId: $projectId, name: $name}}')" > created.json
            if jq -e '.errors and (.errors|length > 0)' created.json >/dev/null; then
              jq '.errors' created.json
              # Observed on the first real run: a Railway PROJECT token can
              # read, deploy, and set variables, but may not create an
              # environment — that needs an account/workspace token. The raw
              # GraphQL reply for this is a bare "Not Authorized", which reads
              # like a broken workflow rather than a missing scope.
              # "already exists" means the listing above missed it — a name the
              # match did not cover, or a project the token can only partially
              # read. Re-resolve rather than fail: the environment is there,
              # which is all this step actually needs.
              if jq -e '[.errors[].message] | any(test("already exists"; "i"))' created.json >/dev/null; then
                echo "::notice::Railway reports the environment already exists — re-resolving."
                ENV_ID=$(resolve_env_id || true)
                if [ -z "$ENV_ID" ]; then
                  echo "::error::'${REVIEW_ENVIRONMENT_NAME}' exists in Railway but is invisible to this token."
                  echo "::notice::Railway refused to create it because the name is taken, yet it does"
                  echo "::notice::not appear in the environment list above. That combination is"
                  echo "::notice::conclusive: RAILWAY_TOKEN is a PROJECT token, and Railway project"
                  echo "::notice::tokens are scoped to ONE environment (here, production)."
                  echo "::notice::Creating the environment by hand does NOT fix this — a token that"
                  echo "::notice::cannot see '${REVIEW_ENVIRONMENT_NAME}' also cannot set its"
                  echo "::notice::variables, create its domain, or deploy to it."
                  echo "::notice::REQUIRED: add a RAILWAY_API_TOKEN repository secret (Railway →"
                  echo "::notice::Account Settings → Tokens). This workflow prefers it when present."
                  echo "::notice::See docs/deployment/review-environment.md."
                  exit 1
                fi
                echo "Resolved existing review environment ${ENV_ID}"
              elif jq -e '[.errors[].message] | any(test("Not Authorized"; "i"))' created.json >/dev/null; then
                echo "::error::Railway refused to create the '${REVIEW_ENVIRONMENT_NAME}' environment: Not Authorized."
                echo "::notice::This is a TOKEN SCOPE limit, not a workflow bug. The repo currently"
                echo "::notice::supplies RAILWAY_TOKEN (a project token), which cannot create"
                echo "::notice::environments. Fix it either way:"
                echo "::notice::  (a) create the environment once by hand — Railway dashboard →"
                echo "::notice::      project → New Environment → name it exactly"
                echo "::notice::      '${REVIEW_ENVIRONMENT_NAME}'. This step then RESOLVES it and"
                echo "::notice::      never needs the elevated scope again; or"
                echo "::notice::  (b) add a RAILWAY_API_TOKEN repository secret (Railway → Account"
                echo "::notice::      Settings → Tokens), which this workflow already prefers when"
                echo "::notice::      present."
                echo "::notice::See docs/deployment/review-environment.md."
              else
                echo "::error::Could not create the review environment."
              fi
              exit 1
            fi
            ENV_ID=$(jq -r '.data.environmentCreate.id' created.json)
            echo "Created review environment ${ENV_ID}"
          else
            echo "Reusing review environment ${ENV_ID}"
          fi

          # The whole point of pinning the production ID: refuse it as a target.
          if [ "$ENV_ID" = "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" ]; then
            echo "::error::Refusing to deploy: the resolved review environment IS production."
            exit 1
          fi

          echo "environment_id=${ENV_ID}" >> "$GITHUB_OUTPUT"

      - name: Set review-environment variables
        env:
          REVIEW_ENVIRONMENT_ID: ${{ steps.environment.outputs.environment_id }}
          E2E_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          # Deliberately NOT set:
          #   DATABASE_URL — no database. Write paths (issuer requests, receipt
          #     candidates) degrade instead of reaching production records.
          #   CLERK_SECRET_KEY — signed-in surfaces are out of scope for a
          #     visual review; the middleware already no-ops without it.
          #
          # RAILWAY_ENVIRONMENT is supplied by Railway itself as the environment
          # NAME ("review"), which is exactly what isCanonicalProduction() reads
          # to refuse indexing. Do not override it.
          #
          # PORT is pinned to match the service domain's targetPort below.
          # Railway routes the public domain to ONE container port; the app
          # listens on $PORT (Dockerfile EXPOSE 3000, `next start -p ${PORT:-3000}`).
          # If those two disagree the domain answers 404 with a perfectly
          # healthy container behind it — the single most common way a
          # correctly-deployed Railway service looks broken.
          # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is set ONLY when we actually have
          # one. Writing it unconditionally wrote the EMPTY STRING whenever
          # E2E_CLERK_PUBLISHABLE_KEY was absent — and that is not a no-op: it
          # overwrites the key inherited from the duplicated production
          # environment, and `apps/web/scripts/docker-build.sh` aborts the build
          # ("FATAL: VITALCV_REQUIRE_AUTH_ENV=1 but NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          # is not present") because VITALCV_REQUIRE_AUTH_ENV=1 is inherited too.
          # The review deploy would have failed at BUILD, after a valid token had
          # got it past every check above. A publishable key is public by design —
          # it already ships in vitalcv.com's client bundle — so inheriting
          # production's is correct here.
          VARS=$(jq -n \
            --arg port "$REVIEW_TARGET_PORT" \
            '{
              BACKEND_URL: "https://api.vitalcv.com",
              NEXT_PUBLIC_API_BASE: "https://api.vitalcv.com",
              PORT: $port
            }')
          if [ -n "${E2E_CLERK_PUBLISHABLE_KEY:-}" ]; then
            VARS=$(jq -n --argjson vars "$VARS" --arg pub "$E2E_CLERK_PUBLISHABLE_KEY" \
              '$vars + {NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: $pub}')
            echo "Overriding NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY from E2E_CLERK_PUBLISHABLE_KEY."
          else
            echo "No E2E_CLERK_PUBLISHABLE_KEY — leaving the inherited publishable key in place."
          fi

          MUTATION='mutation SetVars($input: VariableCollectionUpsertInput!) {
            variableCollectionUpsert(input: $input)
          }'
          # skipDeploys: the upsert would otherwise trigger its OWN deploy of
          # whatever ref the service last used, racing the exact-SHA deploy two
          # steps below — two builds, and a window where the review URL serves
          # the wrong commit. This workflow deploys explicitly and on purpose.
          jq -n --arg query "$MUTATION" \
            --arg projectId "$RAILWAY_PROJECT_ID" \
            --arg environmentId "$REVIEW_ENVIRONMENT_ID" \
            --arg serviceId "$RAILWAY_WEB_SERVICE_ID" \
            --argjson variables "$VARS" \
            '{query: $query, variables: {input: {
              projectId: $projectId, environmentId: $environmentId,
              serviceId: $serviceId, variables: $variables,
              skipDeploys: true
            }}}' > vars-request.json

          curl --fail-with-body --silent --show-error \
            https://backboard.railway.com/graphql/v2 \
            -H "${AUTH_HEADER}" -H 'Content-Type: application/json' \
            --data-binary @vars-request.json > vars.json

          if jq -e '.errors and (.errors|length > 0)' vars.json >/dev/null; then
            jq '.errors' vars.json
            echo "::error::Could not set review-environment variables."
            exit 1
          fi
          echo "Review variables applied (no DATABASE_URL, no CLERK_SECRET_KEY)."

      - name: Resolve or create the review domain
        id: domain
        env:
          REVIEW_ENVIRONMENT_ID: ${{ steps.environment.outputs.environment_id }}
        run: |
          set -euo pipefail

          api() {
            jq -n --arg query "$1" --argjson variables "$2" \
              '{query: $query, variables: $variables}' > dreq.json
            curl --fail-with-body --silent --show-error \
              https://backboard.railway.com/graphql/v2 \
              -H "${AUTH_HEADER}" -H 'Content-Type: application/json' \
              --data-binary @dreq.json
          }

          LIST='query Domains($projectId: String!, $environmentId: String!, $serviceId: String!) {
            domains(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) {
              serviceDomains { id domain targetPort }
              customDomains { id domain }
            }
          }'
          api "$LIST" "$(jq -n \
            --arg projectId "$RAILWAY_PROJECT_ID" \
            --arg environmentId "$REVIEW_ENVIRONMENT_ID" \
            --arg serviceId "$RAILWAY_WEB_SERVICE_ID" \
            '{projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId}')" > domains.json

          DOMAIN=$(jq -r '.data.domains.serviceDomains[0].domain // empty' domains.json)

          if [ -z "$DOMAIN" ]; then
            echo "No review domain yet — creating one."
            CREATE='mutation CreateDomain($input: ServiceDomainCreateInput!) {
              serviceDomainCreate(input: $input) { id domain targetPort }
            }'
            # targetPort is REQUIRED. Omitting it was a real defect in the first
            # version of this workflow — Railway's own docs list environmentId,
            # serviceId and targetPort as the required inputs, and a domain
            # pointed at the wrong port is the documented cause of "service
            # domain created via API returns 404". It matches the PORT variable
            # set two steps above; --argjson keeps it a NUMBER, which the schema
            # requires (a quoted string is rejected).
            api "$CREATE" "$(jq -n \
              --arg environmentId "$REVIEW_ENVIRONMENT_ID" \
              --arg serviceId "$RAILWAY_WEB_SERVICE_ID" \
              --argjson targetPort "$REVIEW_TARGET_PORT" \
              '{input: {environmentId: $environmentId, serviceId: $serviceId, targetPort: $targetPort}}')" > domain-created.json
            if jq -e '.errors and (.errors|length > 0)' domain-created.json >/dev/null; then
              jq '.errors' domain-created.json
              echo "::error::Could not create a review service domain."
              exit 1
            fi
            DOMAIN=$(jq -r '.data.serviceDomainCreate.domain' domain-created.json)
          fi

          # Second refusal: even a correct environment ID must not resolve to
          # the production hostname.
          if [ "$DOMAIN" = "$RAILWAY_PRODUCTION_DOMAIN" ]; then
            echo "::error::Refusing to continue: the review domain resolved to production."
            exit 1
          fi

          echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "Review URL: https://${DOMAIN}"

      - name: Deploy the exact SHA to the review environment
        env:
          REVIEW_ENVIRONMENT_ID: ${{ steps.environment.outputs.environment_id }}
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail

          MUTATION='mutation DeployReview($serviceId: String!, $environmentId: String!, $commitSha: String!) {
            serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId, commitSha: $commitSha)
          }'
          jq -n --arg query "$MUTATION" \
            --arg serviceId "$RAILWAY_WEB_SERVICE_ID" \
            --arg environmentId "$REVIEW_ENVIRONMENT_ID" \
            --arg commitSha "$TARGET_SHA" \
            '{query: $query, variables: {serviceId: $serviceId, environmentId: $environmentId, commitSha: $commitSha}}' \
            > deploy-request.json

          curl --fail-with-body --silent --show-error \
            https://backboard.railway.com/graphql/v2 \
            -H "${AUTH_HEADER}" -H 'Content-Type: application/json' \
            --data-binary @deploy-request.json > deploy.json

          if jq -e '.errors and (.errors|length > 0)' deploy.json >/dev/null; then
            jq '.errors' deploy.json
            echo "::error::Railway rejected the review deployment."
            exit 1
          fi
          echo "Review deployment requested for ${TARGET_SHA}"

      - name: Verify the review URL serves that exact SHA
        id: verify
        env:
          REVIEW_DOMAIN: ${{ steps.domain.outputs.domain }}
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          BASE="https://${REVIEW_DOMAIN}"

          # The same discipline as the production deploy: assert the SHA the
          # site REPORTS, never a 200. A healthy old container answers 200 all
          # day while serving the previous build.
          for attempt in $(seq 1 60); do
            SERVED=$(curl -s --max-time 15 -H 'Cache-Control: no-cache' \
              "${BASE}/api/version" 2>/dev/null \
              | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$SERVED" = "$TARGET_SHA" ]; then
              echo "Review environment is serving ${TARGET_SHA}"
              echo "verified=true" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "attempt ${attempt}: serving '${SERVED:-nothing}', want ${TARGET_SHA}"
            sleep 20
          done

          if [ "${SERVED:-}" != "$TARGET_SHA" ]; then
            echo "::error::Review environment never reported ${TARGET_SHA}."
            exit 1
          fi

          # The review copy must never be indexable. Asserted here rather than
          # trusted, because this is the one deployment where getting it wrong
          # puts a duplicate of the marketing site into search results.
          ROBOTS=$(curl -s --max-time 15 "${BASE}/robots.txt")
          echo "$ROBOTS" | grep -qi 'Disallow: /' || {
            echo "::error::Review robots.txt does not disallow crawling:"; echo "$ROBOTS"; exit 1;
          }
          curl -sI --max-time 15 "${BASE}/" | grep -qi 'x-robots-tag: *noindex' || {
            echo "::error::Review environment is missing the X-Robots-Tag noindex header."; exit 1;
          }
          echo "Indexing refused: robots.txt disallow + X-Robots-Tag noindex confirmed."

      - name: Comment the review URL on the PR
        if: ${{ inputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_DOMAIN: ${{ steps.domain.outputs.domain }}
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          gh pr comment "${{ inputs.pr }}" --body "$(cat <<EOF
          **Review environment updated**

          | | |
          |---|---|
          | URL | https://${REVIEW_DOMAIN} |
          | Serving | \`${TARGET_SHA}\` (verified from \`/api/version\`) |
          | Ref | \`${{ inputs.ref }}\` |

          No database and no Clerk secret: public surfaces and the real NPI
          lookup work, signed-in and write paths degrade. Indexing is refused
          (\`robots.txt\` disallow + \`X-Robots-Tag: noindex\`).

          This environment is shared and always reflects the **last ref pushed
          to it** — re-run *Deploy Review Environment* to claim it.
          EOF
          )"

      - name: Summary
        if: always()
        env:
          REVIEW_DOMAIN: ${{ steps.domain.outputs.domain }}
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          {
            echo "## Review environment"
            echo ""
            echo "- URL: https://${REVIEW_DOMAIN:-(not resolved)}"
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- SHA: \`${TARGET_SHA:-(not resolved)}\`"
            echo "- Verified serving that SHA: ${{ steps.verify.outputs.verified || 'no' }}"
          } >> "$GITHUB_STEP_SUMMARY"
